<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Samer Daghestani" />
    <meta name="description" content="Instagram Clone Application" />
    <meta
      name="keywords"
      content="Instagram, Social Media, Clone, insta, post, story, reel, reels"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Instagram UI Website" />
    <meta
      property="og:description"
      content="Professional UiUx Instagram website using: HTML, CSS, Bootstrap, JavaScript and TypeScript."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instagram UI Website" />
    <meta name="twitter:description" content="Instagram UI Website" />

    <title>Instagram</title>

    <link rel="icon" type="image/x-icon" href="images/icons/logo.ico" />
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/indexMedia.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body class="fg-black">
    <header
      class="header position-fixed top-0 d-flex align-items-center justify-content-center px-4"
    >
      <h1 class="title">Instagram</h1>

      <div class="theme rounded-5 position-absolute end-0 me-4">
        <div class="circle position-absolute top-0 left"></div>
      </div>
    </header>

    <nav class="nav-desktop position-fixed top-0 start-0 d-flex flex-column">
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-brands fa-instagram fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-solid fa-house fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-regular fa-square-caret-right fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-regular fa-paper-plane fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-brands fa-sistrix fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-regular fa-compass fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-regular fa-heart fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-solid fa-plus fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <a href="#">
          <i class="fa-solid fa-chart-column fs-2"></i>
        </a>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <div class="profile rounded-circle"></div>
      </div>
      <div
        class="nav-section d-flex w-100 align-items-center justify-content-center"
      >
        <button class="menu-btn border-0 bg-transparent">
          <i class="fa-solid fa-bars fs-2"></i>
        </button>
      </div>
    </nav>

    <div class="nav-info position-fixed top-0">
      <div class="div-info align-items-center d-flex ps-4 fs-5">Instagram</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Home</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Reels</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Messages</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Search</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Explore</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">
        Notifications
      </div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Create</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Dashboard</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">Profile</div>
      <div class="div-info align-items-center d-flex ps-4 fs-5">More</div>
    </div>

    <main class="main position-relative" id="s">
      <div class="story gap-4 p-4 w-100 d-flex" id="stories"></div>

      <div
        class="posts d-flex flex-column align-items-center gap-4"
        id="posts"
      ></div>
    </main>
    <nav
      class="nav-mobile w-100 justify-content-around align-items-center position-fixed bottom-0 start-0"
    >
      <div class="icon-mobile">
        <a href="#s">
          <i class="fa-solid fa-house fs-3"></i>
        </a>
      </div>
      <div class="icon-mobile">
        <i class="fa-brands fa-sistrix fs-3"></i>
      </div>
      <div class="icon-mobile">
        <i class="fa-regular fa-square-caret-right fs-3"></i>
      </div>
      <div class="icon-mobile">
        <i class="fa-regular fa-paper-plane fs-3"></i>
      </div>
      <div class="icon-mobile">
        <div class="profile border-2 rounded-circle"></div>
      </div>
    </nav>
    <script src="js/main.js"></script>
  </body>
</html>
