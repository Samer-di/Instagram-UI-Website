<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Samer Daghestani" />
    <meta name="description" content="Instagram Clone Application" />
    <meta
      name="keywords"
      content="Instagram, Social Media, Clone, insta, post, story, reel, reels"
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Instagram UI Website" />
    <meta
      property="og:description"
      content="Professional UiUx Instagram website using: HTML, CSS, Bootstrap, JavaScript and TypeScript."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instagram UI Website" />
    <meta name="twitter:description" content="Instagram UI Website" />

    <title>Instagram</title>

    <link rel="icon" type="image/x-icon" href="images/icons/logo.ico" />
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/indexMedia.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body class="fg-black">
    <header
      class="header position-fixed top-0 d-flex align-items-center justify-content-center px-4"
      id="h"
    >
      <h1 class="title">Instagram</h1>

      <div class="theme position-absolute end-0 me-4">
        <div class="circle left"></div>
      </div>
    </header>

    <nav class="nav-desktop position-fixed top-0 start-0 d-flex flex-column">
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-solid fa-house"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-regular fa-square-caret-right"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-regular fa-paper-plane"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-brands fa-sistrix"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-regular fa-compass"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-regular fa-heart"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-solid fa-plus"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <a href="#">
          <i class="fa-solid fa-chart-column"></i>
        </a>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <div class="profile rounded-circle"></div>
      </div>
      <div class="nav-section align-items-center justify-content-center">
        <button class="menu-btn border-0 bg-transparent">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </nav>

    <div class="nav-info position-fixed top-0">
      <div class="div-info align-items-center">Instagram</div>
      <div class="div-info align-items-center">Home</div>
      <div class="div-info align-items-center">Reels</div>
      <div class="div-info align-items-center">Messages</div>
      <div class="div-info align-items-center">Search</div>
      <div class="div-info align-items-center">Explore</div>
      <div class="div-info align-items-center">Notifications</div>
      <div class="div-info align-items-center">Create</div>
      <div class="div-info align-items-center">Dashboard</div>
      <div class="div-info align-items-center">Profile</div>
      <div class="div-info align-items-center">More</div>
    </div>

    <main class="main">
      <div class="story w-100 d-flex" id="stories"></div>

      <div class="posts" id="posts"></div>
    </main>
    <nav class="nav-mobile position-fixed bottom-0 start-0">
      <div class="icon-mobile">
        <i class="fa-solid fa-house"></i>
      </div>
      <div class="icon-mobile">
        <i class="fa-brands fa-sistrix"></i>
      </div>
      <div class="icon-mobile">
        <i class="fa-regular fa-square-caret-right"></i>
      </div>
      <div class="icon-mobile">
        <i class="fa-regular fa-paper-plane"></i>
      </div>
      <div class="icon-mobile">
        <div class="profile border border-2 rounded-circle"></div>
      </div>
    </nav>
    <script src="js/main.js"></script>
  </body>
</html>
